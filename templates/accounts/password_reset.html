{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — GearGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <script>
    (function(){var t=localStorage.getItem('maintainx-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
  </script>
</head>
<body>
  <div class="login-page">
    <aside class="login-brand">
      <div class="brand-content">
        <a href="{% url 'dashboard' %}" class="logo" style="color:#fff;margin-bottom:2rem">
          <i class="fa-solid fa-shield-halved"></i> GearGuard
        </a>
        <div class="brand-illustration">
          <div class="circle circle-1"></div>
          <div class="circle circle-2"></div>
          <div class="circle circle-3"></div>
        </div>
        <h2>Reset Your Password</h2>
        <p>Enter your registered email address and we'll send you instructions to reset your password.</p>
      </div>
    </aside>

    <main class="login-form-side">
      <div style="position:absolute;top:1.5rem;right:1.5rem">
        <button class="btn btn--ghost btn--icon theme-toggle" data-theme-toggle aria-label="Toggle theme">
          <i class="fa-solid fa-moon" data-theme-icon></i>
        </button>
      </div>
      <div class="card login-card">
        <div class="login-card__header">
          <div class="login-card__icon">
            <i class="fa-solid fa-key"></i>
          </div>
          <h1>Forgot Password?</h1>
          <p>We'll send a recovery link to your inbox</p>
        </div>

        <form method="post">
          {% csrf_token %}
          <div class="float-field">
            <label for="email">Email address</label>
            <div class="input-wrapper">
              <input type="email" name="email" id="email" placeholder="Enter your email" required autocomplete="email">
              <i class="fa-solid fa-envelope field-icon"></i>
            </div>
          </div>
          <button type="submit" class="btn btn--primary" style="width:100%">
            <i class="fa-solid fa-paper-plane"></i> Send Reset Link
          </button>
        </form>

        <p class="login-card__footer" style="margin-top:1.5rem">
          Remember your password? <a href="{% url 'login' %}">Back to Sign in</a>
        </p>
      </div>
    </main>
  </div>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
