{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — MaintainX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <script>(function(){var t=localStorage.getItem('maintainx-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar__header"><a href="{% url 'dashboard' %}" class="logo"><i class="fa-solid fa-wrench"></i> MaintainX</a></div>
      <nav class="sidebar__nav">
        <a href="{% url 'dashboard' %}" class="sidebar__link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="{% url 'tickets' %}" class="sidebar__link"><i class="fa-solid fa-ticket"></i> Tickets</a>
        <a href="{% url 'calendar' %}" class="sidebar__link"><i class="fa-solid fa-calendar-days"></i> Calendar</a>
        <a href="{% url 'create_ticket' %}" class="sidebar__link"><i class="fa-solid fa-plus"></i> Create Ticket</a>
        <a href="{% url 'workers' %}" class="sidebar__link"><i class="fa-solid fa-users"></i> Workers</a>
        <a href="{% url 'analytics' %}" class="sidebar__link"><i class="fa-solid fa-chart-line"></i> Analytics</a>
        <a href="{% url 'settings' %}" class="sidebar__link is-active"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
      <div class="sidebar__footer"><a href="{% url 'logout' %}" class="sidebar__link"><i class="fa-solid fa-right-from-bracket"></i> Log out</a></div>
    </aside>
    <div class="sidebar-overlay"></div>
    <div class="app-main">
      <header class="topbar">
        <div class="topbar__left">
          <button class="btn btn--ghost btn--icon topbar__menu-btn" data-sidebar-toggle aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
        </div>
        <div class="topbar__right">
          <button class="btn btn--ghost btn--icon theme-toggle" data-theme-toggle aria-label="Toggle theme"><i class="fa-solid fa-moon" data-theme-icon></i></button>
        </div>
      </header>
      <main class="page-content">
        <header class="page-header">
          <div><h1>Settings</h1><p>Manage your account and preferences</p></div>
        </header>
        <div class="card card__body" style="max-width:720px" data-tabs>
          <nav class="tabs">
            <button type="button" class="tab-btn is-active" data-tab="profile">Profile</button>
            <button type="button" class="tab-btn" data-tab="security">Security</button>
            <button type="button" class="tab-btn" data-tab="preferences">Preferences</button>
          </nav>
          <section class="tab-panel is-active" data-panel="profile">
            <div class="form-group">
              <label class="form-label" for="name">Full name</label>
              <input type="text" id="name" class="form-input" value="{{ user.first_name|default:'Alex Morgan' }}">
            </div>
            <div class="form-group">
              <label class="form-label" for="settings-email">Email</label>
              <input type="email" id="settings-email" class="form-input" value="{{ user.email|default:'alex@maintainx.com' }}">
            </div>
            <div class="form-group">
              <label class="form-label" for="role">Role</label>
              <input type="text" id="role" class="form-input" value="{{ user.user_type|title|default:'Facility Manager' }}" readonly>
            </div>
            <button class="btn btn--primary">Save changes</button>
          </section>
          <section class="tab-panel" data-panel="security">
            <div class="form-group" style="position:relative">
              <label class="form-label" for="current-pw">Current password</label>
              <input type="password" id="current-pw" class="form-input" style="padding-right:2.75rem">
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" data-password-toggle="current-pw" style="top:2.4rem;transform:none">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="form-group" style="position:relative">
              <label class="form-label" for="new-pw">New password</label>
              <input type="password" id="new-pw" class="form-input" style="padding-right:2.75rem">
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" data-password-toggle="new-pw" style="top:2.4rem;transform:none">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <label class="toggle">
              <input type="checkbox" checked>
              <span class="toggle__track"></span>
              <span class="toggle__thumb"></span>
              <span class="toggle__label">Two-factor authentication</span>
            </label>
            <button class="btn btn--primary" style="margin-top:1.5rem">Update password</button>
          </section>
          <section class="tab-panel" data-panel="preferences">
            <div style="display:flex;flex-direction:column;gap:1.25rem">
              <label class="toggle">
                <input type="checkbox" id="pref-email" checked>
                <span class="toggle__track"></span>
                <span class="toggle__thumb"></span>
                <span class="toggle__label">Email notifications for new tickets</span>
              </label>
              <label class="toggle">
                <input type="checkbox" id="pref-push" checked>
                <span class="toggle__track"></span>
                <span class="toggle__thumb"></span>
                <span class="toggle__label">Push notifications for urgent tickets</span>
              </label>
              <label class="toggle">
                <input type="checkbox" id="pref-digest">
                <span class="toggle__track"></span>
                <span class="toggle__thumb"></span>
                <span class="toggle__label">Weekly digest email</span>
              </label>
            </div>
            <button class="btn btn--primary" style="margin-top:1.5rem">Save preferences</button>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
